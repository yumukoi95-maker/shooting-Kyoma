<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>KYOMA - Pixel Fighting Arena</title>

<!-- Load Brython -->
<script src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/brython@3.12.0/brython_stdlib.js"></script>

<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#100e20;
  color:white;
  font-family:monospace;
  text-align:center;
  overflow-x:hidden;
}
header {
  padding:12px;
  background:#211936;
  border-bottom:3px solid #f6b73c;
}
h1 {
  margin:0;
  color:#ffca55;
  font-size:clamp(27px,5vw,42px);
  letter-spacing:6px;
  text-shadow:3px 3px #a52a46;
}
.subtitle { color:#c8b8e8; margin-top:5px; }
.game-wrap {
  width:min(960px,100%);
  margin:15px auto;
  padding:0 8px;
}
canvas {
  display:block;
  width:100%;
  height:auto;
  background:#17152b;
  border:4px solid #a88ae9;
  image-rendering:pixelated;
  image-rendering:crisp-edges;
  box-shadow:0 0 24px #8b5cf6;
  touch-action:none;
}
.info {
  color:#c8b8e8;
  font-size:12px;
  margin:10px;
  line-height:1.8;
}
button {
  background:#6537a8;
  color:white;
  border:2px solid #d3aaff;
  padding:12px 17px;
  font-family:monospace;
  font-weight:bold;
  cursor:pointer;
  margin:5px;
  border-radius:5px;
}
button:hover { background:#9158df; }
.controls {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:6px;
  margin:12px auto;
}
.controls button {
  min-width:65px;
  min-height:48px;
  font-size:13px;
  touch-action:none;
  user-select:none;
}
#message {
  color:#ffda72;
  font-size:18px;
  min-height:25px;
  margin:10px;
}
</style>
</head>
<body onload="brython()">

<header>
  <h1>KYOMA</h1>
  <div class="subtitle">PIXEL FIGHTING ARENA · VERSION 1.0</div>
</header>

<div class="game-wrap">
  <canvas id="game" width="960" height="540"></canvas>

  <div id="message">PRESS START TO FIGHT!</div>

  <button id="start">START GAME</button>
  <button id="restart">REMATCH</button>

  <div class="info">
    PLAYER 1 VS CPU · FIRST TO 2 ROUNDS WINS
    <br>
    KEYBOARD: A / D = MOVE · W = JUMP · S = BLOCK
    <br>
    J = PUNCH · K = KICK · L = SPECIAL · H = PYTHON HEAL · U = PYTHON FIREBALL
  </div>

  <div class="controls">
    <button data-key="a">◀ LEFT</button>
    <button data-key="d">RIGHT ▶</button>
    <button data-key="w">JUMP</button>
    <button data-key="s">BLOCK</button>
    <button data-key="j">PUNCH</button>
    <button data-key="k">KICK</button>
    <button data-key="l">SPECIAL</button>
  </div>
</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");

ctx.imageSmoothingEnabled = false;

const W = 960;
const H = 540;
const FLOOR = 440;

let GRAVITY = 0.65;
let KICK_DAMAGE = 12;
let KICK_RANGE = 82;
let PUNCH_DAMAGE = 7;
let PUNCH_RANGE = 64;

let running = false;
let gameOver = false;
let roundOver = false;
let round = 1;
let playerWins = 0;
let cpuWins = 0;
let timer = 60;
let timerTick = 0;
let lastTime = 0;
let roundDelay = 0;
let screenFlash = 0;
let shake = 0;
let projectiles = [];
let particles = [];
let keys = {};
let pressed = {};
let cpuThink = 0;
let roundMessage = "";
let audio = null;
let audioEnabled = true;

const colors = {
  player: {
    body:"#e9434e",
    dark:"#81283c",
    skin:"#ffc18c",
    hair:"#242039",
    belt:"#f5d56c"
  },
  cpu: {
    body:"#328ce5",
    dark:"#164477",
    skin:"#edb28a",
    hair:"#17243a",
    belt:"#f2f2ff"
  }
};

function fighter(x, side, palette, name) {
  return {
    x, y:FLOOR, vx:0, vy:0,
    side, palette, name,
    hp:100, maxHp:100, facing:side,
    grounded:true,
    blocking:false,
    attack:null,
    attackTimer:0,
    hitDone:false,
    cooldown:0,
    specialCooldown:0,
    invulnerable:0,
    anim:0,
    moving:false,
    stunned:0
  };
}

let p1, cpu;

function resetFighters() {
  p1 = fighter(230,1,colors.player,"KYOMA");
  cpu = fighter(730,-1,colors.cpu,"SHADOW");
  projectiles = [];
  particles = [];
  cpuThink = 0;

  if (typeof window.onRoundStart === "function") {
    try { window.onRoundStart(); } catch(e) {}
  }
}

function startGame() {
  round = 1;
  playerWins = 0;
  cpuWins = 0;
  gameOver = false;
  roundOver = false;
  running = true;
  timer = 60;
  timerTick = 0;
  roundDelay = 0;
  screenFlash = 0;
  resetFighters();
  message.textContent = "FIGHT!";
  sound(440,0.1);
}

function nextRound() {
  round++;
  roundOver = false;
  timer = 60;
  timerTick = 0;
  roundDelay = 0;
  resetFighters();
  message.textContent = "ROUND " + round + " - FIGHT!";
  sound(660,0.12);
}

function sound(freq, duration) {
  if (!audioEnabled) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.045,audio.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001,audio.currentTime+duration);
    osc.connect(gain);
    gain.connect(audio.destination);
    osc.start();
    osc.stop(audio.currentTime+duration);
  } catch(e) {}
}

function rect(x,y,w,h,color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x),Math.round(y),w,h);
}

function text(str,x,y,size,color="#fff",align="center") {
  ctx.font = "bold " + size + "px monospace";
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.fillText(str,x,y);
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,"#171a42");
  sky.addColorStop(0.7,"#49315e");
  sky.addColorStop(1,"#211b36");
  ctx.fillStyle=sky;
  ctx.fillRect(0,0,W,H);

  ctx.fillStyle="#ffdc91";
  ctx.beginPath();
  ctx.arc(750,105,48,0,Math.PI*2);
  ctx.fill();
  ctx.fillStyle="#f4b6a0";
  ctx.beginPath();
  ctx.arc(770,92,42,0,Math.PI*2);
  ctx.fill();

  for(let i=0;i<35;i++){
    const x=(i*173+41)%W;
    const y=(i*79+17)%250;
    rect(x,y,3,3,"#e5d5ff");
  }

  for(let i=0;i<8;i++){
    const x=i*145-50;
    ctx.fillStyle=i%2?"#302b54":"#282547";
    ctx.beginPath();
    ctx.moveTo(x,390);
    ctx.lineTo(x+95,225+(i%3)*35);
    ctx.lineTo(x+190,390);
    ctx.fill();
  }

  rect(365,265,230,130,"#211e3c");
  rect(340,250,280,20,"#12162d");
  rect(400,215,160,35,"#211e3c");
  rect(425,195,110,20,"#12162d");
  rect(450,175,60,20,"#211e3c");
  rect(445,295,70,100,"#11162c");
  rect(375,300,12,50,"#e7a65b");
  rect(573,300,12,50,"#e7a65b");

  rect(0,FLOOR,W,H-FLOOR,"#30233d");
  rect(0,FLOOR,W,8,"#e4a45c");
  for(let i=0;i<24;i++){
    rect(i*44,FLOOR+25,30,3,"#49354c");
  }
  for(let i=0;i<12;i++){
    rect(i*85,FLOOR+70,42,4,"#49354c");
  }
}

function drawFighter(f) {
  const c=f.palette;
  const x=Math.round(f.x);
  const y=Math.round(f.y);
  const dir=f.facing;
  const bob=f.grounded && !f.attack ? Math.sin(f.anim*0.12)*2 : 0;
  const lift=f.y<FLOOR-2 ? -2 : 0;

  ctx.save();
  ctx.translate(x,y+bob+lift);
  ctx.scale(dir,1);

  if(f.invulnerable>0 && Math.floor(f.invulnerable/4)%2===0){
    ctx.globalAlpha=0.5;
  }

  ctx.globalAlpha*=0.8;
  ctx.fillStyle="#100e1c";
  ctx.beginPath();
  ctx.ellipse(0,0,28,7,0,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;

  let legSwing=f.moving && f.grounded ? Math.sin(f.anim*0.3)*7:0;
  if(f.attack==="kick" && f.attackTimer>0){
    rect(-15,-29,12,23,c.dark);
    rect(-17,-9,18,8,"#17182d");
    rect(4,-42,34,11,c.dark);
    rect(34,-45,12,14,"#17182d");
  } else {
    rect(-15,-29,12,23,c.dark);
    rect(3,-29,12,23,c.dark);
    rect(-17+legSwing,-9,18,8,"#17182d");
    rect(2-legSwing,-9,18,8,"#17182d");
  }

  rect(-17,-66,34,38,c.body);
  rect(-19,-63,38,8,c.dark);
  rect(-5,-57,10,17,c.dark);
  rect(-15,-38,30,5,c.belt);

  if(f.blocking){
    rect(8,-66,12,25,c.skin);
    rect(9,-74,10,16,c.dark);
    rect(-19,-66,11,22,c.skin);
  } else if(f.attack==="punch" && f.attackTimer>0){
    rect(12,-62,30,11,c.skin);
    rect(37,-64,11,15,c.dark);
  } else {
    rect(11,-64,11,22,c.skin);
    rect(-22,-64,11,22,c.skin);
  }

  rect(-7,-78,14,12,c.skin);
  rect(-13,-102,26,27,c.skin);

  rect(-15,-107,30,12,c.hair);
  rect(-17,-101,8,12,c.hair);
  rect(8,-101,9,10,c.hair);
  rect(-9,-113,8,8,c.hair);
  rect(1,-113,8,8,c.hair);

  rect(4,-91,4,4,"#17162a");
  rect(12,-91,4,4,"#17162a");

  rect(-14,-99,28,5,c.belt);
  rect(-18,-100,7,4,c.belt);

  rect(-8,-39,5,13,c.belt);
  rect(3,-39,5,10,c.belt);

  ctx.restore();

  if(f.attack && f.attackTimer>0){
    if(f.attack==="kick"){
      text("✦",x+dir*53,y-42,29,"#ffdc65");
    }
    if(f.attack==="punch"){
      text("✧",x+dir*43,y-68,25,"#fff2c1");
    }
  }
}

function drawHealth() {
  const barW=350;
  const barH=24;

  rect(35,27,barW,barH,"#20192f");
  rect(575,27,barW,barH,"#20192f");

  const p1Ratio = Math.min(1, Math.max(0, p1.hp / 100));
  const cpuRatio = Math.min(1, Math.max(0, cpu.hp / 100));

  rect(35,27,barW*p1Ratio,barH,"#e84352");
  rect(575+barW*(1-cpuRatio),27,barW*cpuRatio,barH,"#398ff1");

  ctx.strokeStyle="#fff";
  ctx.lineWidth=3;
  ctx.strokeRect(35,27,barW,barH);
  ctx.strokeRect(575,27,barW,barH);

  text(p1.name,35,19,18,"#ffca65","left");
  text(cpu.name,925,19,18,"#80c5ff","right");

  text("ROUND "+round,480,25,15,"#fff");
  text(String(Math.ceil(timer)).padStart(2,"0"),480,72,30,"#ffda83");
  text("P1 ("+Math.ceil(p1.hp)+" HP)",35,70,12,"#fff","left");
  text("CPU ("+Math.ceil(cpu.hp)+" HP)",925,70,12,"#fff","right");

  text("WINS: "+playerWins,35,88,12,"#ffca65","left");
  text("WINS: "+cpuWins,925,88,12,"#80c5ff","right");
}

function spawnHit(x,y,color) {
  for(let i=0;i<12;i++){
    particles.push({
      x,y,
      vx:(Math.random()-0.5)*7,
      vy:(Math.random()-0.5)*7,
      life:18+Math.random()*12,
      color
    });
  }
}

function drawEffects() {
  for(const p of particles){
    rect(p.x,p.y,4,4,p.color);
  }
  for(const b of projectiles){
    ctx.fillStyle="#ffe68a";
    ctx.beginPath();
    ctx.arc(b.x,b.y,12,0,Math.PI*2);
    ctx.fill();
    ctx.fillStyle="#ff6b47";
    ctx.fillRect(b.x-5,b.y-5,10,10);
  }
}

function updateEffects(dt) {
  for(const p of particles){
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vy+=0.15*dt;
    p.life-=dt;
  }
  particles=particles.filter(p=>p.life>0);
}

function attack(f,type) {
  if(!running) startGame();
  if(roundOver || gameOver || f.stunned>0) return;

  if(type==="special"){
    if(f.specialCooldown>0) return;
    f.specialCooldown=150;
    f.cooldown=30;
    projectiles.push({
      x:f.x+f.facing*35,
      y:f.y-55,
      vx:f.facing*7,
      owner:f,
      life:100
    });
    sound(190,0.25);
    spawnHit(f.x+f.facing*30,f.y-55,"#ffda65");
    return;
  }

  if(f.cooldown>0 || f.attackTimer>0) return;

  f.attack=type;
  f.attackTimer=type==="punch"?19:29;
  f.cooldown=type==="punch"?22:32;
  f.hitDone=false;
  sound(type==="punch"?280:160,0.08);
}

function hit(attacker,defender,type) {
  if(defender.invulnerable>0) return false;

  const range=type==="punch"?PUNCH_RANGE:KICK_RANGE;
  const distance=Math.abs(attacker.x-defender.x);
  const front=(defender.x-attacker.x)*attacker.facing>=0;

  if(distance>range || !front) return false;

  if(type==="kick" && defender.y<FLOOR-70) return false;

  const blocked=defender.blocking && defender.grounded &&
    (attacker.x-defender.x)*defender.facing>0;

  let damage=type==="punch"?PUNCH_DAMAGE:KICK_DAMAGE;
  if(blocked) damage=2;

  defender.hp=Math.max(0,defender.hp-damage);
  defender.vx=blocked?attacker.facing*1.5:attacker.facing*5;
  defender.vy=blocked?-1:-4;
  defender.stunned=blocked?5:11;
  defender.invulnerable=blocked?5:12;

  spawnHit(defender.x,defender.y-55,blocked?"#8ee9ff":"#ffdf6e");
  screenFlash=blocked?2:4;
  shake=blocked?2:5;
  sound(blocked?500:95,0.12);
  return true;
}

function updateFighter(f,enemy,dt,isPlayer) {
  f.anim+=dt;
  f.cooldown=Math.max(0,f.cooldown-dt);
  f.specialCooldown=Math.max(0,f.specialCooldown-dt);
  f.invulnerable=Math.max(0,f.invulnerable-dt);
  f.stunned=Math.max(0,f.stunned-dt);
  f.attackTimer=Math.max(0,f.attackTimer-dt);

  if(f.attackTimer<=0) f.attack=null;

  f.facing=enemy.x>=f.x?1:-1;
  f.moving=false;

  if(f.stunned<=0 && !roundOver){
    if(isPlayer){
      const left=keys.a || keys.arrowleft;
      const right=keys.d || keys.arrowright;

      f.blocking=!!keys.s || !!keys.arrowdown;

      if(!f.blocking && !f.attack){
        if(left){f.vx=-3.7;f.moving=true;}
        else if(right){f.vx=3.7;f.moving=true;}
        else f.vx*=0.75;
      } else if(f.blocking){
        f.vx*=0.65;
      }

      if((pressed.w || pressed.arrowup) && f.grounded){
        f.vy=-12;
        f.grounded=false;
        sound(350,0.08);
      }

      if(pressed.j) attack(f,"punch");
      if(pressed.k) attack(f,"kick");
      if(pressed.l) attack(f,"special");

    } else {
      f.blocking=false;
      const distance=Math.abs(enemy.x-f.x);
      cpuThink-=dt;

      if(cpuThink<=0){
        cpuThink=12+Math.random()*12;

        if(distance>125){
          f.vx=f.x<enemy.x?2.3:-2.3;
          f.moving=true;
        } else if(distance>75){
          f.vx=0;
          if(Math.random()<0.65) attack(f,"punch");
          else attack(f,"kick");
        } else {
          if(Math.random()<0.42) attack(f,"punch");
          else if(Math.random()<0.75) attack(f,"kick");
          else f.blocking=true;
        }

        if(distance>180 && Math.random()<0.16){
          attack(f,"special");
        }

        if(enemy.attackTimer>0 && distance<95 && Math.random()<0.55){
          f.blocking=true;
        }

        if(f.grounded && distance>140 && Math.random()<0.1){
          f.vy=-11;
          f.grounded=false;
        }
      }
    }
  } else {
    f.vx*=0.88;
    f.blocking=false;
  }

  f.vy+=GRAVITY*dt;
  f.x+=f.vx*dt;
  f.y+=f.vy*dt;

  f.x=Math.max(45,Math.min(W-45,f.x));

  if(f.y>=FLOOR){
    f.y=FLOOR;
    f.vy=0;
    f.grounded=true;
  }

  f.vx*=Math.pow(0.92,dt);

  if(f.attack && f.attackTimer>4 && !f.hitDone){
    const active=f.attack==="punch"
      ? f.attackTimer<=17 && f.attackTimer>=6
      : f.attackTimer<=26 && f.attackTimer>=8;

    if(active){
      if(hit(f,enemy,f.attack)){
        f.hitDone=true;
      }
    }
  }
}

function updateProjectiles(dt) {
  for(const b of projectiles){
    b.x+=b.vx*dt;
    b.life-=dt;
    const target=b.owner===p1?cpu:p1;

    if(Math.abs(b.x-target.x)<30 && Math.abs(b.y-(target.y-55))<45){
      if(target.invulnerable<=0){
        const blocked=target.blocking;
        target.hp=Math.max(0,target.hp-(blocked?4:18));
        target.stunned=blocked?5:18;
        target.invulnerable=blocked?6:18;
        target.vx=b.vx>0?5:-5;
        spawnHit(target.x,target.y-55,"#ffdc63");
        sound(110,0.2);
        shake=6;
      }
      b.life=0;
    }
  }
  projectiles=projectiles.filter(b=>b.life>0 && b.x>0 && b.x<W);
}

function finishRound(winner) {
  if(roundOver || gameOver) return;
  roundOver=true;
  roundDelay=150;
  running=true;

  if(winner==="player"){
    playerWins++;
    roundMessage=p1.name+" WINS THE ROUND!";
  } else if(winner==="cpu"){
    cpuWins++;
    roundMessage=cpu.name+" WINS THE ROUND!";
  } else {
    roundMessage="DRAW!";
  }

  message.textContent=roundMessage;
  sound(winner==="player"?700:150,0.5);

  if(playerWins>=2 || cpuWins>=2){
    gameOver=true;
    message.textContent=playerWins>=2?"🏆 "+p1.name+" IS THE CHAMPION!":cpu.name+" WINS THE MATCH!";
  }
}

function update(dt) {
  if(!running || gameOver) return;

  if(roundOver){
    roundDelay-=dt;
    if(roundDelay<=0){
      if(!gameOver) nextRound();
    }
    return;
  }

  updateFighter(p1,cpu,dt,true);
  updateFighter(cpu,p1,dt,false);

  const gap=Math.abs(cpu.x-p1.x);
  if(gap<43 && Math.abs(cpu.y-p1.y)<70){
    const push=(43-gap)/2;
    if(p1.x<cpu.x){
      p1.x-=push;
      cpu.x+=push;
    } else {
      p1.x+=push;
      cpu.x-=push;
    }
  }

  updateProjectiles(dt);
  updateEffects(dt);

  timerTick+=dt;
  if(timerTick>=60){
    timerTick-=60;
    timer=Math.max(0,timer-1);
  }

  if(p1.hp<=0) finishRound("cpu");
  else if(cpu.hp<=0) finishRound("player");
  else if(timer<=0){
    if(p1.hp>cpu.hp) finishRound("player");
    else if(cpu.hp>p1.hp) finishRound("cpu");
    else finishRound("draw");
  }

  screenFlash=Math.max(0,screenFlash-dt);
  shake=Math.max(0,shake-dt);
}

function drawOverlay() {
  if(!running){
    ctx.fillStyle="rgba(10,8,25,0.72)";
    ctx.fillRect(0,0,W,H);
    text(p1 ? p1.name : "KYOMA",480,190,65,"#ffca55");
    text("PIXEL FIGHTING ARENA",480,235,23,"#fff");
    text("FIGHT YOUR WAY TO VICTORY",480,290,17,"#d7baff");
    text("PRESS START",480,365,22,"#ffe48b");
  }

  if(roundOver){
    ctx.fillStyle="rgba(8,5,20,0.35)";
    ctx.fillRect(0,150,W,160);
    text(roundMessage,480,230,30,"#ffe17c");
    if(!gameOver) text("NEXT ROUND...",480,275,18);
  }

  if(gameOver){
    ctx.fillStyle="rgba(8,5,20,0.8)";
    ctx.fillRect(0,0,W,H);
    text("MATCH OVER",480,175,36,"#ffdb70");
    text(playerWins>=2?p1.name+" CHAMPION!":cpu.name+" CHAMPION!",480,250,29);
    text("PRESS REMATCH TO PLAY AGAIN",480,320,19,"#fff");
  }
}

function render() {
  ctx.save();

  if(shake>0){
    ctx.translate((Math.random()-0.5)*shake*2,(Math.random()-0.5)*shake*2);
  }

  drawBackground();
  drawHealth();

  rect(35,105,160,8,"#211d32");
  rect(35,105,160*(1-p1.specialCooldown/150),8,"#ffcf55");
  rect(765,105,160,8,"#211d32");
  rect(765,105,160*(1-cpu.specialCooldown/150),8,"#64caff");

  drawFighter(p1);
  drawFighter(cpu);
  drawEffects();
  drawOverlay();

  if(screenFlash>0){
    ctx.fillStyle="rgba(255,255,255,"+(screenFlash*0.035)+")";
    ctx.fillRect(0,0,W,H);
  }

  ctx.restore();
}

function loop(time) {
  const dt=Math.min((time-lastTime)/16.667,2.5)||1;
  lastTime=time;
  update(dt);
  render();
  pressed={};
  requestAnimationFrame(loop);
}

window.addEventListener("keydown",e=>{
  const k=e.key.toLowerCase();
  if(["arrowleft","arrowright","arrowup","arrowdown"," "].includes(k)){
    e.preventDefault();
  }
  if(!running && ["a","d","w","s","j","k","l"].includes(k)){
    startGame();
  }
  if(!keys[k]) pressed[k]=true;
  keys[k]=true;
});

window.addEventListener("keyup",e=>{
  keys[e.key.toLowerCase()]=false;
});

window.addEventListener("blur",()=>{
  keys={};
  pressed={};
});

document.querySelectorAll("[data-key]").forEach(btn=>{
  const k=btn.dataset.key;
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    if(!running) startGame();
    keys[k]=true;
    pressed[k]=true;
    btn.setPointerCapture(e.pointerId);
  });
  const release=()=>{
    keys[k]=false;
  };
  btn.addEventListener("pointerup",release);
  btn.addEventListener("pointercancel",release);
  btn.addEventListener("lostpointercapture",release);
});

document.getElementById("start").addEventListener("click",()=>{
  startGame();
});

document.getElementById("restart").addEventListener("click",()=>{
  startGame();
});

window.Arena = {
  getP1: () => p1,
  getCPU: () => cpu,
  colors: colors,
  setGravity: (g) => { GRAVITY = g; },
  setKickDamage: (dmg) => { KICK_DAMAGE = dmg; },
  setKickRange: (rng) => { KICK_RANGE = rng; },
  setPunchDamage: (dmg) => { PUNCH_DAMAGE = dmg; },
  attack: (who, type) => {
    const f = who === "p1" ? p1 : cpu;
    f.cooldown = 0;
    f.attackTimer = 0;
    attack(f, type);
  },
  spawnHit: (x, y, color) => spawnHit(x, y, color)
};

resetFighters();
render();
requestAnimationFrame(loop);

})();
</script>
